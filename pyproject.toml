[tool.poetry]
name = "streamlit-hexviz"
version = "0.1.2"
description = "Simple H3, S2 and A5 map visualizations for Streamlit"
authors = ["Robert Ziegltrum <robert.ziegltrum@googlemail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/Robert-Ziegltrum/streamlit-hexviz"
keywords = ["streamlit", "h3", "s2", "a5", "geospatial", "pydeck", "visualization"]

packages = [{ include = "streamlit_hexviz" }]

[tool.poetry.dependencies]
python = "^3.9"  # Adjust based on your minimal supported version
streamlit = "^1.0"
h3 = "^4.0"    # Or ^4.0 depending on your pinning
pydeck = "^0.9.2"
numpy = "*"
pandas = "*"
pya5= "*"
# Optional dependency for S2
s2geometry = { version = "*", optional = true }

[tool.poetry.extras]
s2 = ["s2geometry"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


